  <title id="title">Electric Blue Winking Gamepad</title>
  <style>
/* All paths and colors are preserved from the approved static logo. */
.wink-motion { transform-box: view-box; transform-origin: 299px 214px; animation: wink 5.4s ease-in-out infinite; }
.smile-motion { animation: smile 5.4s ease-in-out infinite; }
.cheek-motion { animation: cheek 5.4s ease-in-out infinite; }
.pad-pulse { animation: pulse 5.4s ease-in-out infinite; }
@keyframes wink { 0%,37%,43%,100% { transform:scaleY(1); } 39.5% { transform:scaleY(.22); } 41% { transform:scaleY(.22); } }
@keyframes smile { 0%,35%,48%,100% { transform:translateY(0); } 40% { transform:translateY(-3px); } }
@keyframes cheek { 0%,34%,49%,100% { opacity:1; } 40% { opacity:.6; } 44% { opacity:1; } }
@keyframes pulse { 0%,30%,65%,100% { opacity:.65; } 40% { opacity:1; } 52% { opacity:.78; } }
@media (prefers-reduced-motion: reduce) { .wink-motion,.smile-motion,.cheek-motion,.pad-pulse { animation:none !important; } }
</style><desc id="desc">Original rounded-square neon gamepad in arctic cyan and blue, with one open eye, one winking eye, a smile and cheek dimple.</desc>
